<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f7ebf4;--surface:#fff;--ink:#3a2336;--muted:#8a7585;--line:#ecd9e6;
    --accent:#8a2f7d;--accent-deep:#5f1a54;--accent-soft:#f3e2ef;--ok:#4f9b6b;
    --field-bg:#fbf4f9;--head1:#5c1a51;--head2:#8a3a7d;
    --fontdisp:"Fraunces",Georgia,serif;--fontbody:"Inter",system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#221420;--surface:#2d1f2a;--ink:#f4e7f0;--muted:#b79fb0;--line:#43303e;
    --accent:#cd7ec0;--accent-deep:#e0a6d4;--accent-soft:#3a2636;--ok:#85c29a;
    --field-bg:#271a24;--head1:#3f1138;--head2:#6d2a63;color-scheme:dark;}}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  *{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
  body{background:var(--bg);color:var(--ink);font-family:var(--fontbody);line-height:1.5}
  .banner{background:linear-gradient(160deg,var(--head1),var(--head2));text-align:center;padding:22px 18px 18px;color:#fff}
  .banner img{width:66px;height:66px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.5);margin-bottom:9px}
  .banner h1{font-family:var(--fontdisp);font-weight:600;font-size:20px;margin:0}
  .banner p{margin:3px 0 0;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.82)}
  .wrap{max-width:460px;margin:0 auto;padding:22px 20px 44px}
  .como{display:flex;align-items:flex-start;justify-content:center;gap:4px;margin:4px 0 22px}
  .cstep{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:110px}
  .cstep .ic{width:46px;height:46px;border-radius:50%;background:linear-gradient(150deg,var(--head2),var(--head1));display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 5px 13px rgba(74,19,64,.28)}
  .cstep .lb{font-size:11px;color:var(--muted);line-height:1.3;font-weight:500}
  .cstep .lb b{color:var(--accent-deep);display:block;font-size:12px}
  .carrow{color:var(--accent);font-size:18px;margin-top:14px;flex:0 0 auto}
  .prog{display:flex;align-items:center;gap:8px;margin:0 0 16px}
  .bar{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--head2),var(--accent));border-radius:99px;transition:width .4s ease}
  .pcount{font-size:12px;font-weight:600;color:var(--accent-deep);white-space:nowrap}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 17px;box-shadow:0 10px 26px rgba(92,26,81,.12)}
  .q{font-family:var(--fontdisp);font-size:20px;color:var(--accent-deep);text-align:center;margin:2px 0 4px;line-height:1.2}
  .qsub{text-align:center;font-size:13px;color:var(--muted);margin:0 0 16px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;cursor:pointer;background:var(--field-bg);border:2px solid var(--line);border-radius:13px;padding:12px 38px;font-family:inherit;color:var(--ink);text-align:center;position:relative;transition:transform .12s,box-shadow .12s,border-color .12s}
  @media(hover:hover){.opt:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(92,26,81,.16);border-color:var(--accent)}}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt .oic{flex:0 0 38px;height:38px;border-radius:50%;background:linear-gradient(150deg,var(--head2),var(--head1));display:flex;align-items:center;justify-content:center;font-size:19px}
  .opt .otx{flex:0 1 auto}.opt .otx b{display:block;font-size:15px;color:var(--ink)}.opt .otx small{font-size:12px;color:var(--muted)}
  .opt .arr{position:absolute;right:14px;color:var(--accent);font-size:20px;font-weight:600}
  .optrow{display:flex;gap:10px}.optrow .opt{flex:1;justify-content:center;text-align:center}
  .field{display:flex;flex-direction:column;gap:7px}
  .field+.field{margin-top:13px}
  .field label{font-size:14px;font-weight:600;color:var(--ink)}
  .field .opt-tag{color:var(--muted);font-weight:400;font-size:12px}
  input,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--field-bg);border:1px solid var(--line);border-radius:11px;padding:13px 14px;width:100%}
  input:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  input.bad{border-color:#c0506b}
  textarea{resize:vertical;min-height:80px}
  .err{font-size:12.5px;color:#c0506b;margin:0;display:none}.err.show{display:block}
  .hint{font-size:12.5px;color:var(--muted);margin:0}
  .row{display:flex;gap:10px}.row .field{flex:1;margin-top:0}.row .field.uf{flex:0 0 96px}
  .aviso{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:9px;padding:11px 13px;font-size:12.5px;color:var(--accent-deep);font-weight:500;line-height:1.45;margin-top:4px}
  .aviso b{font-weight:700}
  .nav{display:flex;gap:10px;margin-top:20px}
  .btn{font-family:inherit;font-weight:600;border-radius:12px;padding:14px;cursor:pointer;font-size:15px;border:none}
  .back{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--accent-deep);padding:14px 18px}
  .next{flex:1;background:linear-gradient(145deg,var(--head2),var(--head1));color:#fff;box-shadow:0 8px 20px rgba(74,19,64,.35)}
  .next:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
  .skip{display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);font-family:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
  .sendwa{width:100%;background:linear-gradient(145deg,#25d366,#128c4b);color:#fff;font-size:17px;padding:17px;border:none;border-radius:14px;font-weight:600;cursor:pointer;box-shadow:0 10px 24px rgba(18,140,75,.4);display:flex;align-items:center;justify-content:center;gap:9px}
  .copy{width:100%;margin-top:11px;background:transparent;color:var(--accent-deep);border:1px solid var(--accent);border-radius:12px;padding:13px;font-family:inherit;font-size:14.5px;font-weight:500;cursor:pointer}
  .copy.ok{border-color:var(--ok);color:var(--ok)}
  .preco{background:var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
  .preco .tp{font-size:13px;color:var(--accent-deep);font-weight:600;margin:0 0 10px}
  .preco .big{font-family:var(--fontdisp);font-size:33px;color:var(--accent-deep);font-weight:600;line-height:1}
  .preco .big small{font-size:14px;font-weight:600;color:var(--muted);display:block;margin-top:3px;font-family:var(--fontbody)}
  .preco .mid{font-family:var(--fontdisp);font-size:24px;color:var(--accent-deep);font-weight:600;line-height:1.1}
  .preco .mid small{font-size:12.5px;font-weight:500;color:var(--muted);display:block;margin-top:2px;font-family:var(--fontbody)}
  .preco .alt{font-size:13px;color:var(--ink);margin:9px 0 0}
  .preco .inc{font-size:12.5px;color:var(--accent-deep);font-weight:600;margin-top:12px;line-height:1.4}
  .preco .nota{font-size:12px;color:var(--muted);margin:10px 0 0}
  .vermais{margin-top:12px;background:linear-gradient(145deg,var(--head2),var(--head1));border:none;color:#fff;font-family:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:7px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 11px rgba(74,19,64,.3);transition:transform .12s,box-shadow .12s}
  .vermais:active{transform:translateY(1px);box-shadow:0 2px 7px rgba(74,19,64,.28)}
  .preco .taxabox{background:var(--surface);border:1.5px dashed var(--accent);border-radius:10px;padding:10px 12px;margin-top:11px;font-size:12.5px;color:var(--accent-deep);font-weight:600;line-height:1.4}
  .badge-wrap{text-align:center;margin:0 0 12px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:7px 15px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase}
  .badge-eu{background:linear-gradient(145deg,var(--head2),var(--head1));color:#fff;box-shadow:0 4px 11px rgba(74,19,64,.3)}
  .badge-pag{background:var(--accent-soft);color:var(--accent-deep);border:1.5px dashed var(--accent)}
  .det{margin-top:12px;background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;font-size:12.5px;color:var(--ink);line-height:1.6;font-family:var(--fontbody)}
  .det ul{margin:0;padding-left:18px}.det li{font-size:12.5px;line-height:1.5;margin-bottom:3px}
  .det p{font-size:12.5px;line-height:1.5;font-family:var(--fontbody)}.det b{color:var(--accent-deep)}
  .det table{width:100%;border-collapse:collapse}
  .det td{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink)}
  .det td:last-child{text-align:right;font-weight:700;color:var(--accent-deep)}
  .det tr:last-child td{border-bottom:none}
  .depo{background:var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:16px 6px;display:flex;align-items:center;gap:3px;min-height:140px}
  .depo-mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:9px;text-align:center;min-height:110px;padding:0 2px}
  .depo-nav{flex:0 0 32px;width:32px;height:32px;border-radius:50%;border:none;background:var(--surface);color:var(--accent-deep);font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(92,26,81,.2);display:flex;align-items:center;justify-content:center;padding-bottom:3px}
  .depo-nav:active{transform:scale(.9)}
  .depo-stars{color:#f4b63e;letter-spacing:2px;font-size:14px}
  .depo-q{font-size:14px;line-height:1.5;color:var(--ink);font-style:italic;transition:opacity .3s ease;margin:0}
  .depo-fonte{font-size:11px;color:var(--muted);margin:3px 0 0}
  .prox{font-family:var(--fontdisp);font-size:17px;color:var(--accent-deep);text-align:center;margin:16px 0 2px;line-height:1.3}
  .fim{text-align:center;padding:8px 4px}
  .fim .tick{width:70px;height:70px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .fim h2{font-family:var(--fontdisp);color:var(--accent-deep);font-size:22px;margin:0 0 6px}
  .fim p{font-size:13.5px;color:var(--muted);margin:0 0 18px;line-height:1.5}
  .fade{animation:fade .3s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .resumo{text-align:left;background:var(--field-bg);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:0 0 16px;font-size:13px;color:var(--ink);line-height:1.6}
  .resumo b{color:var(--accent-deep)}

  /* ===== polimento premium ===== */
  .card{position:relative}
  @keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  .card.inR{animation:inR .34s cubic-bezier(.2,.75,.25,1) both}
  .card.inL{animation:inL .34s cubic-bezier(.2,.75,.25,1) both}
  .opt{-webkit-tap-highlight-color:transparent}
  .opt:active{transform:scale(.985)}
  .opt .chk{position:absolute;right:12px;width:24px;height:24px;border-radius:50%;background:linear-gradient(145deg,var(--head2),var(--head1));color:#fff;display:none;align-items:center;justify-content:center;font-size:13px;font-weight:800;box-shadow:0 3px 8px rgba(74,19,64,.35)}
  .opt.picked{border-color:var(--accent);background:var(--accent-soft);transform:scale(.985)}
  .opt.picked .chk{display:flex;animation:pop .25s ease both}
  .opt.picked .arr{display:none}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .btn,.sendwa,.vermais,.depo-nav{-webkit-tap-highlight-color:transparent}
  .next:not(:disabled):active,.sendwa:active{transform:translateY(2px)}
  .wa-title{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 8px}
  .wa-wrap{background:#0b141a;border-radius:14px;padding:12px 12px 12px 28px;margin:0 0 16px;background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:14px 14px}
  .wa{background:#005c4b;color:#e9edef;border-radius:12px;border-top-right-radius:4px;padding:9px 11px 7px;font-size:12.5px;line-height:1.5;text-align:left;max-height:250px;overflow:auto;box-shadow:0 1px 1px rgba(0,0,0,.3)}
  .wa .ln{white-space:pre-wrap;word-break:break-word}
  .wa b{font-weight:700;color:#fff}.wa i{font-style:italic;color:#cfe3dc}
  .wa .mono{font-family:"SF Mono",Menlo,Consolas,monospace;background:rgba(0,0,0,.3);padding:1px 6px;border-radius:5px;font-size:11px;letter-spacing:.03em}
  .wa .wq{border-left:3px solid #6fd0b4;padding-left:8px;color:#d6ece4;margin:2px 0}
  .wa .hr{border-top:1px solid rgba(255,255,255,.18);margin:6px 0}
  .wa .meta{text-align:right;font-size:10px;color:#9fc3b8;margin-top:3px}
  .recomecar{display:block;margin:12px auto 0;background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
  @media(prefers-reduced-motion:reduce){.card.inR,.card.inL,.opt.picked .chk{animation:none}}
</style>
</head>

        st.push({id:"pcpf",type:"field",badge:{t:"pag",txt:"🧾 Dados de quem vai pagar"},q:"CPF do pagante",field:"pcpf",label:"CPF do pagante",ph:"000.000.000-00",required:true,cpf:true});if(!cpfValido(v("pcpf")))return st;
      }
    }
    st.push({id:"lnome",type:"field",badge:{t:"eu",txt:"💜 Seus dados"},q:(enviaLamina()?"Dados para a entrega":"Seus dados"),sub:"Como você se chama?",field:"lnome",label:"Nome completo",ph:"Seu nome completo",required:true});if(!v("lnome"))return st;
    st.push({id:"lcpf",type:"field",badge:{t:"eu",txt:"💜 Seus dados"},q:"Seu CPF",field:"lcpf",label:"CPF",ph:"000.000.000-00",required:true,cpf:true});if(!cpfValido(v("lcpf")))return st;
    st.push({id:"ltel",type:"field",badge:{t:"eu",txt:"💜 Seus dados"},q:"Telefone com DDD",field:"ltel",label:"Telefone",ph:"(21) 99999-9999",required:true,tel:true});if(!v("ltel"))return st;
    st.push({id:"lemail",type:"field",badge:{t:"eu",txt:"💜 Seus dados"},q:"E-mail",sub:"Opcional, para rastreio",field:"lemail",label:"E-mail",ph:"seu@email.com",optional:true});
    if(enviaLamina()){st.push({id:"endereco",type:"endereco",modo:"lamina"});if(!(v("lcep")&&v("lend")&&v("lnum")&&v("lbairro")&&v("lcidade")&&v("lestado")))return st;}
    st.push({id:"prova",type:"prova",badge:{t:"eu",txt:"💜 Você está em boas mãos"},q:"Relatos reais de mulheres",sub:"Mulheres que cuidam da saúde com a Dra. Livia"});
    st.push({id:"fim",type:"fim"});
    return st;
  }

  // ---------- RENDER ----------
  var idx=0;
  function render(){
    if(_depoTimer){clearInterval(_depoTimer);_depoTimer=null;}
    var lista=steps();
    if(idx>lista.length-1) idx=lista.length-1;
    if(idx<0) idx=0;
    var p=lista[idx];
    el("barfill").style.width=(p.type==="fim"?100:Math.min(92,12+idx*11))+"%";
    el("pcount").textContent=(p.type==="fim"?"Pronto!":"Passo "+(idx+1));
    var c=el("card");c.className="card";void c.offsetWidth;c.classList.add(dir<0?"inL":"inR");
    salvar();

    if(p.type==="fim"){
      var primeiro=(S.modo==="lamina"?v("lnome"):v("nome")).split(/\s+/)[0]||"tudo certo";
      c.innerHTML='<div class="fim"><div class="tick">✓</div><h2>Tudo pronto, '+primeiro+'!</h2>'+
        '<p>É só tocar em enviar. A mensagem já vai prontinha. 💜</p></div>'+
        '<p class="wa-title">Veja como vai chegar no WhatsApp 👇</p>'+
        '<div class="wa-wrap"><div class="wa">'+waRender(paraEnvio(mensagem()))+'<div class="meta">'+hojeFmt().split(" às ")[1]+' ✓✓</div></div></div>'+
        '<button class="sendwa" type="button" onclick="enviarWhats()">💬 Enviar no WhatsApp</button>'+
        '<button class="copy" id="copybtn" type="button" onclick="copiarMsg(this)">Copiar mensagem</button>'+
        '<div class="nav" style="margin-top:14px"><button class="btn back" type="button" onclick="voltar()">‹ Voltar</button></div>';
      if(!c.dataset.fimFeito){ c.dataset.fimFeito="1"; confete(); }
      return;
    }

    var h=(p.badge?'<div class="badge-wrap"><span class="badge badge-'+p.badge.t+'">'+p.badge.txt+'</span></div>':'')+(p.q?'<p class="q">'+p.q+'</p>':''); if(p.sub) h+='<p class="qsub">'+p.sub+'</p>';

    if(p.type==="valores"){
      h+=cardValores(S.patend);
      h+='<div class="nav"><button class="btn back" type="button" onclick="voltar()">‹ Voltar</button><button class="btn next" type="button" onclick="avancar()">Continuar ›</button></div>';
      c.innerHTML=h; return;
    }
    if(p.type==="valores-lamina"){
      h+=cardValoresLamina();
      h+='<div class="nav"><button class="btn back" type="button" onclick="voltar()">‹ Voltar</button><button class="btn next" type="button" onclick="avancar()">Continuar ›</button></div>';
      c.innerHTML=h; return;
    }
    if(p.type==="prova"){
      h+='<div class="depo"><button class="depo-nav" type="button" onclick="depoGo(-1)">‹</button>'+
         '<div class="depo-mid"><div class="depo-stars">★★★★★</div><p class="depo-q" id="depoq"></p><p class="depo-fonte">Relato real · destaques do Instagram</p></div>'+
         '<button class="depo-nav" type="button" onclick="depoGo(1)">›</button></div>';
      h+='<p class="prox">Você está em ótimas mãos. 💜</p>';
      h+='<div class="nav"><button class="btn back" type="button" onclick="voltar()">‹ Voltar</button><button class="btn next" type="button" onclick="avancar()">Continuar ›</button></div>';
      c.innerHTML=h;
      _depoI=Math.floor(Math.random()*DEPO.length);
      depoShow(true); depoAuto();
      return;
    }
    if(p.type==="choice"){
      h+='<div class="'+(p.row?"optrow":"opts")+'">';
      p.opts.forEach(function(o){
        var selzinho = S[p.field]===o.val ? " sel":"";
        h+='<button class="opt'+selzinho+'" type="button" onclick="escolher(\''+p.field+'\',\''+o.val.replace(/'/g,"\\'")+'\',this)">'+
           (o.ic?'<span class="oic">'+o.ic+'</span>':'')+
           '<span class="otx"><b>'+o.b+'</b>'+(o.s?'<small>'+o.s+'</small>':'')+'</span>'+
           (p.row?'':'<span class="arr">›</span>')+'<span class="chk">✓</span></button>';
      });
      h+='</div>';
      h+='<div class="nav">'+(idx>0?'<button class="btn back" type="button" onclick="voltar()">‹ Voltar</button>':'')+'</div>';
      if(p.optional) h+='<button class="skip" type="button" onclick="pular()">Pular esta etapa</button>';
      c.innerHTML=h; return;
    }
    if(p.type==="field"){
      var tag=p.optional?' <span class="opt-tag">(opcional)</span>':'';
      var needErr=p.cpf||p.data||p.email;
      var errMsg=p.cpf?"CPF inválido. Confira os números.":(p.data?"Data inválida.":"E-mail inválido.");
      if(p.textarea) h+='<div class="field"><label>'+p.label+tag+'</label><textarea id="inp" placeholder="'+p.ph+'">'+v(p.field)+'</textarea></div>';
      else h+='<div class="field"><label>'+p.label+tag+'</label><input id="inp" type="text" placeholder="'+p.ph+'" value="'+v(p.field)+'">'+(needErr?'<p class="err" id="flderr">'+errMsg+'</p>':'')+'</div>';
      h+='<div class="nav"><button class="btn back" type="button" onclick="voltar()">‹ Voltar</button><button class="btn next" id="nextbtn" type="button" onclick="salvarCampo()">Continuar ›</button></div>';
      c.innerHTML=h;
      var inp=el("inp"); inp.dataset.field=p.field;
      if(p.cpf) inp.dataset.cpf="1"; if(p.tel) inp.dataset.tel="1"; if(p.data) inp.dataset.data="1"; if(p.email) inp.dataset.email="1"; if(p.required) inp.dataset.req="1";
      if(p.cpf||p.data) inp.inputMode="numeric"; else if(p.tel) inp.inputMode="tel"; else if(p.email){ inp.inputMode="email"; inp.autocomplete="email"; }
      if(/nome/.test(p.field)) inp.autocomplete="name";
      inp.addEventListener("keydown",function(e){ if(e.key==="Enter"&&!p.textarea){ e.preventDefault(); var nb=el("nextbtn"); if(nb&&!nb.disabled) nb.click(); } });
      inp.addEventListener("input",function(){
        if(inp.dataset.cpf) inp.value=maskCPF(inp.value);
        if(inp.dataset.tel) inp.value=maskBR(inp.value);
        if(inp.dataset.data) inp.value=maskData(inp.value);
        S[p.field]=inp.value;
        atualizaNext(p);
      });
      atualizaNext(p);
      inp.focus();
      return;
    }
  }
  function atualizaNext(p){
    var inp=el("inp"), nb=el("nextbtn"); if(!inp||!nb) return;
    var ok=true, val=inp.value.trim();
    if(p.required && !val) ok=false;
    if(p.cpf && !cpfValido(val)) ok=false;
    if(p.data && !dataValida(val)) ok=false;
    if(p.email && val && !/^\S+@\S+\.\S+$/.test(val)) ok=false;
    nb.disabled=!ok;
    var er=el("flderr");
    if(er){ var bad=false;
      if(p.cpf) bad=val&&!cpfValido(val);
      else if(p.data) bad=val&&!dataValida(val);
      else if(p.email) bad=val&&!/^\S+@\S+\.\S+$/.test(val);
      er.classList.toggle("show",!!bad); inp.classList.toggle("bad",!!bad);
    }
  }
  var busy=false, dir=1;
  function escolher(field,val,btn){
    if(busy) return;
    if(btn){
      busy=true;
      document.querySelectorAll('.opt.picked').forEach(function(b){b.classList.remove('picked');});
      btn.classList.add('picked');
      setTimeout(function(){ busy=false; aplicarEscolha(field,val); }, 270);
      return;
    }
    aplicarEscolha(field,val);
  }
  function aplicarEscolha(field,val){
    if(S[field]!==val){
      S[field]=val;
      if(field==="modo"){ S.patend="";S.ppag="";S.pnf="Não";S.ppagante="sim";S.ltem="nao";S.lpac="Pacote 1 • 1 análise";S.lpag="Pix";S.lnf="Não";S.lpagante="sim"; }
      if(field==="patend"){ S.ppag="";S.pnf="Não";S.ppagante="sim"; }
      if(field==="pnf" && val!=="Sim"){ S.ppagante="sim"; }
      if(field==="lpac"){ if(val.indexOf("Pacote 2")===0) S.lpag="Pix"; }
      if(field==="lnf" && val!=="Sim"){ S.lpagante="sim"; }
    }
    avancar();
  }
  function pular(){ avancar(); }
  function salvarCampo(){ var inp=el("inp"); if(inp){ S[inp.dataset.field]=inp.value.trim(); } avancar(); }
  function avancar(){ dir=1; idx++; var lista=steps(); if(idx>lista.length-1) idx=lista.length-1; render(); wireCEP(); window.scrollTo({top:0,behavior:"smooth"}); }
  function voltar(){ if(idx>0){ dir=-1; idx--; render(); wireCEP(); } }

  // ---------- ENDEREÇO (passo especial) ----------
  function renderEnderecoFicha(){
    var c=el("card");
    var h='<div class="badge-wrap"><span class="badge badge-eu">💜 Seus dados</span></div><p class="q">Seu endereço</p><p class="qsub">Comece pelo CEP que a gente adianta 💜</p>'+
      '<div class="field"><label>CEP</label><input id="cep" inputmode="numeric" placeholder="00000-000" value="'+v("cep")+'"><p class="hint" id="cephint" style="display:none"></p></div>'+
      '<div class="row"><div class="field"><label>Endereço (rua)</label><input id="end" placeholder="Nome da rua" value="'+v("end")+'"></div><div class="field uf"><label>Número</label><input id="num" inputmode="numeric" placeholder="Nº" value="'+v("num")+'"></div></div>'+
      '<div class="field"><label>Complemento <span class="opt-tag">(opcional)</span></label><input id="compl" placeholder="Apto, bloco, casa..." value="'+v("compl")+'"></div>'+
      '<div class="row"><div class="field"><label>Cidade</label><input id="cidade" placeholder="Cidade" value="'+v("cidade")+'"></div><div class="field uf"><label>Estado</label><input id="estado" maxlength="2" placeholder="UF" value="'+v("estado")+'" style="text-transform:uppercase"></div></div>'+
      '<div class="nav"><button class="btn back" type="button" onclick="voltar()">‹ Voltar</button><button class="btn next" id="nextbtn" type="button" onclick="salvarEndereco()">Continuar ›</button></div>';
    c.className="card";void c.offsetWidth;c.classList.add(dir<0?"inL":"inR"); c.innerHTML=h;
    ["cep","end","num","compl","cidade","estado"].forEach(function(id){
      var inp=el(id); inp.addEventListener("input",function(){ if(id==="cep")inp.value=maskCEP(inp.value); S[id]=inp.value; checkEndF(); });
    });
    el("cep").addEventListener("blur",function(){ buscaCEPFicha(el("cep").value); });
    checkEndF();
  }
  function checkEndF(){ var nb=el("nextbtn"); if(!nb)return; var ok=v("cep")&&v("end")&&v("num")&&v("cidade")&&v("estado"); nb.disabled=!ok; }
  async function buscaCEPFicha(cepValue){ var d=cepValue.replace(/\D/g,""); if(d.length!==8)return; var hintEl=el("cephint"); if(hintEl){hintEl.textContent="Buscando endereço...";hintEl.style.color="";hintEl.style.display="block";} try{ var resp=await fetch("https://viacep.com.br/ws/"+d+"/json/"); var data=await resp.json(); if(!data.erro){ if(data.logradouro&&!v("end")){S.end=data.logradouro;el("end").value=data.logradouro;} if(data.localidade){S.cidade=data.localidade;el("cidade").value=data.localidade;} if(data.uf){S.estado=data.uf;el("estado").value=data.uf;} if(hintEl)hintEl.style.display="none"; checkEndF(); return; } if(hintEl){hintEl.textContent="CEP não encontrado. Pode preencher manualmente.";hintEl.style.color="#c0506b";} }catch(e){ if(hintEl)hintEl.style.display="none"; } }

  function renderEnderecoLamina(){
    var c=el("card");
    var h='<div class="badge-wrap"><span class="badge badge-eu">💜 Seus dados</span></div><p class="q">Endereço de entrega</p><p class="qsub">Comece pelo CEP que a gente adianta 💜</p>'+
      '<div class="field"><label>CEP</label><input id="lcep" inputmode="numeric" placeholder="00000-000" value="'+v("lcep")+'"><p class="hint" id="cephint" style="display:none"></p></div>'+
      '<div class="row"><div class="field"><label>Endereço (rua)</label><input id="lend" placeholder="Nome da rua" value="'+v("lend")+'"></div><div class="field uf"><label>Número</label><input id="lnum" inputmode="numeric" placeholder="Nº" value="'+v("lnum")+'"></div></div>'+
      '<div class="field"><label>Complemento <span class="opt-tag">(opcional)</span></label><input id="lcompl" placeholder="Apto, bloco, casa..." value="'+v("lcompl")+'"></div>'+
      '<div class="field"><label>Bairro</label><input id="lbairro" placeholder="Bairro" value="'+v("lbairro")+'"></div>'+
      '<div class="field"><label>Ponto de referência <span class="opt-tag">(opcional)</span></label><input id="lref" placeholder="Ajuda o carteiro a achar" value="'+v("lref")+'"></div>'+
      '<div class="row"><div class="field"><label>Cidade</label><input id="lcidade" placeholder="Cidade" value="'+v("lcidade")+'"></div><div class="field uf"><label>Estado</label><input id="lestado" maxlength="2" placeholder="UF" value="'+v("lestado")+'" style="text-transform:uppercase"></div></div>'+
      '<div class="nav"><button class="btn back" type="button" onclick="voltar()">‹ Voltar</button><button class="btn next" id="nextbtn" type="button" onclick="salvarEndereco()">Continuar ›</button></div>';
    c.className="card";void c.offsetWidth;c.classList.add(dir<0?"inL":"inR"); c.innerHTML=h;
    ["lcep","lend","lnum","lcompl","lbairro","lref","lcidade","lestado"].forEach(function(id){
      var inp=el(id); inp.addEventListener("input",function(){ if(id==="lcep")inp.value=maskCEP(inp.value); S[id]=inp.value; checkEndL(); });
    });
    el("lcep").addEventListener("blur",function(){ buscaCEPLamina(el("lcep").value); });
    checkEndL();
  }
  function checkEndL(){ var nb=el("nextbtn"); if(!nb)return; var ok=v("lcep")&&v("lend")&&v("lnum")&&v("lbairro")&&v("lcidade")&&v("lestado"); nb.disabled=!ok; }
  async function buscaCEPLamina(cepValue){ var d=cepValue.replace(/\D/g,""); if(d.length!==8)return; var hintEl=el("cephint"); if(hintEl){hintEl.textContent="Buscando endereço...";hintEl.style.color="";hintEl.style.display="block";} try{ var resp=await fetch("https://viacep.com.br/ws/"+d+"/json/"); var data=await resp.json(); if(!data.erro){ if(data.logradouro&&!v("lend")){S.lend=data.logradouro;el("lend").value=data.logradouro;} if(data.bairro&&!v("lbairro")){S.lbairro=data.bairro;el("lbairro").value=data.bairro;} if(data.localidade){S.lcidade=data.localidade;el("lcidade").value=data.localidade;} if(data.uf){S.lestado=data.uf;el("lestado").value=data.uf;} if(hintEl)hintEl.style.display="none"; checkEndL(); return; } if(hintEl){hintEl.textContent="CEP não encontrado. Pode preencher manualmente.";hintEl.style.color="#c0506b";} }catch(e){ if(hintEl)hintEl.style.display="none"; } }

  function salvarEndereco(){ avancar(); }
  function wireCEP(){ var lista=steps(); var p=lista[idx]; if(p&&p.type==="endereco"){ if(p.modo==="ficha") renderEnderecoFicha(); else renderEnderecoLamina(); } }

  function enviarWhats(){ var texto=paraEnvio(mensagem()); var link="https://wa.me/"+NUMERO+"?text="+encodeURIComponent(texto); try{ localStorage.removeItem(LS_KEY); }catch(e){} try{window.location.href=link;}catch(e){try{window.open(link,"_blank");}catch(e2){}} }
  function copiarMsg(btn){ var texto=paraEnvio(mensagem()); function ok(){btn.textContent="Copiado!";btn.classList.add("ok");setTimeout(function(){btn.textContent="Copiar mensagem";btn.classList.remove("ok");},2200);} if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(texto).then(ok).catch(function(){sel();});}else sel(); function sel(){var ta=document.createElement("textarea");ta.value=texto;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");ok();}catch(e){}document.body.removeChild(ta);} }

  restaurar(); render(); wireCEP();
</script>
